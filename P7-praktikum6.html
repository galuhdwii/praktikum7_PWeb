<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.2 - Dynamic Node & Event Delegation</title>
  <style>
      .todo-app { width: 100%; max-width: 400px; font-family: Arial, sans-serif; }
      .input-group { display: flex; margin-bottom: 15px; }
      .input-group input { flex: 1; padding: 8px; font-size: 14px; }
      .input-group button { padding: 8px 12px; background-color: #27ae60; color: white; border: none; cursor: pointer; }
      .todo-list { list-style: none; padding: 0; }
      .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #f9f9f9; border-bottom: 1px solid #ddd; }
      .todo-item.completed span { text-decoration: line-through; color: #888; }
      .action-btns button { margin-left: 5px; padding: 4px 8px; cursor: pointer; border: none; border-radius: 3px; }
      .btn-complete { background-color: #2980b9; color: white; }
      .btn-delete { background-color: #c0392b; color: white; }
  </style>
</head>
<body>

  <div class="todo-app">
      <h2>Aplikasi Pengelola Tugas (To-Do List)</h2>

      <div class="input-group">
          <input type="text" id="task-input" placeholder="Tuliskan tugas baru...">
          <button id="btn-add">Tambah</button>
      </div>

      <!-- Kontainer Induk untuk Event Delegation -->
      <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
  </script>
</body>
</html>
