<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.2 - Dynamic Node & Event Delegation</title>
  <style>
      .todo-app { width: 100%; max-width: 400px; font-family: Arial, sans-serif; }
      .input-group { display: flex; margin-bottom: 15px; }
      .input-group input { flex: 1; padding: 8px; font-size: 14px; }
      .input-group button { padding: 8px 12px; background-color: #27ae60; color: white; border: none; cursor: pointer; }
      .todo-list { list-style: none; padding: 0; }
      .todo-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: #f9f9f9; border-bottom: 1px solid #ddd; }
      .todo-item.completed span { text-decoration: line-through; color: #888; }
      .action-btns button { margin-left: 5px; padding: 4px 8px; cursor: pointer; border: none; border-radius: 3px; }
      .btn-complete { background-color: #2980b9; color: white; }
      .btn-delete { background-color: #c0392b; color: white; }
  </style>
</head>
<body>

  <div class="todo-app">
      <h2>Aplikasi Pengelola Tugas (To-Do List)</h2>

      <div class="input-group">
          <input type="text" id="task-input" placeholder="Tuliskan tugas baru...">
          <button id="btn-add">Tambah</button>
      </div>

      <!-- Kontainer Induk untuk Event Delegation -->
      <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    // Langkah 2
    const taskInput = document.getElementById('task-input');
    const btnAdd = document.getElementById('btn-add');
    const todoList = document.getElementById('todo-list');

    // 1. Fungsi Pembuatan Node Dinamis
    function addTask() {
        const taskText = taskInput.value.trim();

        // Validasi input kosong
        if (taskText === '') {
            alert('Teks tugas tidak boleh kosong!');
            return;
        }

        // Membuat elemen LI baru secara programatis
        const li = document.createElement('li');
        li.className = 'todo-item';

        // Mengisi struktur internal node baru
        li.innerHTML = `
            <span>${taskText}</span>
            <div class="action-btns">
                <button class="btn-complete">Selesai</button>
                <button class="btn-delete">Hapus</button>
            </div>
        `;

        // Menyisipkan node baru ke dalam hirarki DOM (appendChild)
        todoList.appendChild(li);

        // Reset bidang input teks dan fokuskan kembali
        taskInput.value = '';
        taskInput.focus();
    }

    // 2. Penerapan Event Delegation pada Elemen Induk (ul#todo-list)
    todoList.addEventListener('click', (e) => {
        const target = e.target;


        // Memeriksa apakah elemen yang diklik adalah tombol Selesai
        if (target.classList.contains('btn-complete')) {
            const parentLi = target.closest('.todo-item');
            parentLi.classList.toggle('completed');
        }


        // Memeriksa apakah elemen yang diklik adalah tombol Hapus
        if (target.classList.contains('btn-delete')) {
            const parentLi = target.closest('.todo-item');
            
            // Menghapus node secara langsung dari struktur DOM
            parentLi.remove(); 
            // Alternatif sintaks tradisional: todoList.removeChild(parentLi);
        }
    });

        // Event listener untuk tombol Tambah dan tombol Enter
        btnAdd.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

  </script>
</body>
</html>
