<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.2 - Manipulasi DOM Dinamis</title>
  <style>
      .card {
          width: 300px;
          padding: 20px;
          border: 1px solid #ccc;
          border-radius: 8px;
          font-family: Arial, sans-serif;
          transition: background-color 0.3s, color 0.3s;
      }
      .profile-img {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          object-fit: cover;
      }
      .dark-mode {
          background-color: #2c3e50;
          color: #ecf0f1;
          border-color: #34495e;
      }
      .btn {
          margin-top: 10px;
          padding: 8px 12px;
          cursor: pointer;
      }
  </style>
</head>
<body>


  <div id="profile-card" class="card">
      <img id="avatar" class="profile-img" src="../aset foto/foto.jpeg" alt="Avatar Pengguna">
      <h2 id="user-name">Nama Pengguna</h2>
      <p id="user-bio">Bio singkat pengguna akan ditampilkan di sini.</p>
      <a id="profile-link" href="https://example.com" target="_blank">Kunjungi Profil</a>
  </div>


  <br>
  <!-- Tombol kontrol interaktif -->
  <button class="btn" onclick="updateContent()">Ubah Konten</button>


  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
  </script>
</body>
</html>
