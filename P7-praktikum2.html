<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.2 - Manipulasi DOM Dinamis</title>
  <style>
      .card {
          width: 300px;
          padding: 20px;
          border: 1px solid #ccc;
          border-radius: 8px;
          font-family: Arial, sans-serif;
          transition: background-color 0.3s, color 0.3s;
      }
      .profile-img {
          width: 100px;
          height: 100px;
          border-radius: 50%;
          object-fit: cover;
      }
      .dark-mode {
          background-color: #2c3e50;
          color: #ecf0f1;
          border-color: #34495e;
      }
      .btn {
          margin-top: 10px;
          padding: 8px 12px;
          cursor: pointer;
      }
  </style>
</head>
<body>


  <div id="profile-card" class="card">
      <img id="avatar" class="profile-img" src="https://simoster.org/imagesprofile/member_SM2024121314275695719359.png" alt="Avatar Pengguna">
      <h2 id="user-name">Nama Pengguna</h2>
      <p id="user-bio">Bio singkat pengguna akan ditampilkan di sini.</p>
      <a id="profile-link" href="https://example.com" target="_blank">Kunjungi Profil</a>
  </div>


  <br>
  <!-- Tombol kontrol interaktif -->
  <button class="btn" onclick="updateContent()">Ubah Konten</button>
  <button class="btn" onclick="updateAttributes()">Ganti Foto & Tautan</button>


  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    //langkah 2
        function updateContent() {
            const nameEl = document.getElementById('user-name');
            const bioEl = document.getElementById('user-bio');

            // Penggunaan textContent (Aman untuk teks murni)
            nameEl.textContent = 'Adlan Nugroho, M.T.I.';

            // Penggunaan innerHTML (Dapat merender tag HTML seperti <strong>)
            bioEl.innerHTML = 'Dosen <strong>Jurusan Komputer dan Bisnis</strong> Politeknik Negeri Cilacap.';
        }

        //langkah 3
        function updateAttributes() {
            const avatarEl = document.getElementById('avatar');
            const linkEl = document.getElementById('profile-link');


            // Memanipulasi atribut HTML dengan setAttribute
            avatarEl.setAttribute('src', 'https://via.placeholder.com/100/0000FF/808080?text=Adlan');
            avatarEl.setAttribute('alt', 'Foto Profil Adlan');


            linkEl.setAttribute('href', 'https://pnc.ac.id');
            linkEl.textContent = 'Kunjungi Website PNC';


            // Manipulasi langsung properti style
            avatarEl.style.border = '3px solid #3498db';
        }

  </script>
</body>
</html>
