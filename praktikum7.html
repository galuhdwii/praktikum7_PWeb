<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.1 - Eksplorasi DOM</title>
</head>
<body>


  <div id="main-container">
      <h1 id="title">Daftar Modul Pembelajaran</h1>
      <p class="description">Silakan pilih materi yang ingin dipelajari.</p>


      <ul id="course-list">
          <li class="item">Pemrograman Web</li>
          <li class="item">Struktur Data</li>
          <li class="item">Basis Data</li>
      </ul>
  </div>


  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    // 1. Seleksi Elemen Tunggal
        const titleEl = document.getElementById('title');
        const descEl = document.querySelector('.description');


        console.log('Title Element:', titleEl);
        console.log('Description Element:', descEl);

  </script>
</body>
</html>
