<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.1 - Eksplorasi DOM</title>
</head>
<body>


  <div id="main-container">
      <h1 id="title">Daftar Modul Pembelajaran</h1>
      <p class="description">Silakan pilih materi yang ingin dipelajari.</p>


      <ul id="course-list">
          <li class="item">Pemrograman Web</li>
          <li class="item">Struktur Data</li>
          <li class="item">Basis Data</li>
      </ul>
  </div>


  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    // 1. Seleksi Elemen Tunggal
        const titleEl = document.getElementById('title');
        const descEl = document.querySelector('.description');


        console.log('Title Element:', titleEl);
        console.log('Description Element:', descEl);

    // 2. Perbandingan HTMLCollection (Live) vs NodeList (Static)
        const liveCollection = document.getElementsByClassName('item');
        const staticNodeList = document.querySelectorAll('.item');


        // Cetak jumlah elemen awal
        console.log('Jumlah awal HTMLCollection:', liveCollection.length); // Output: 3
        console.log('Jumlah awal NodeList:', staticNodeList.length);       // Output: 3


        // Menambahkan elemen <li> baru ke dalam DOM secara dinamis
        const ulList = document.getElementById('course-list');
        const newLi = document.createElement('li');
        newLi.className = 'item';
        newLi.textContent = 'Jaringan Komputer';


        ulList.appendChild(newLi); // Elemen baru dimasukkan ke halaman


        // Membuktikan sifat Live vs Static setelah penambahan elemen
        console.log('Jumlah setelah penambahan (HTMLCollection):', liveCollection.length); // Output: 4 (Live/Otomatis update)
        console.log('Jumlah setelah penambahan (NodeList):', staticNodeList.length);       // Output: 3 (Static/Tetap sesuai snapshot awal)
        
    // 3. Navigasi Node
        const firstItem = ulList.firstElementChild;


        console.log('Elemen pertama dalam daftar:', firstItem.textContent);
        console.log('Parent node dari UL:', ulList.parentNode);
        console.log('Sibling berikutnya dari elemen pertama:', firstItem.nextElementSibling.textContent);
        
  </script>
</body>
</html>
