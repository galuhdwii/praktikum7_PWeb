<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.2 - Validasi Form Sisi Klien</title>
  <style>
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
      .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
      .error-message { color: #d9534f; font-size: 0.85em; margin-top: 5px; display: none; }
      .input-error { border: 1px solid #d9534f; }
      .input-success { border: 1px solid #5cb85c; }
      .btn-submit { padding: 10px 15px; background-color: #0275d8; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Formulir Pendaftaran Akun</h2>

  <!-- Atribut novalidate dimanfaatkan untuk mematikan pesan balon bawaan browser -->
  <form id="registration-form" novalidate>
      <div class="form-group">
          <label for="fullname">Nama Lengkap:</label>
          <input type="text" id="fullname" required minlength="3">
          <div class="error-message" id="error-fullname">Nama lengkap wajib diisi (minimal 3 karakter).</div>
      </div>

      <div class="form-group">
          <label for="email">Alamat Email:</label>
          <input type="email" id="email" required>
          <div class="error-message" id="error-email">Format alamat email tidak valid.</div>
      </div>

      <div class="form-group">
          <label for="password">Kata Sandi:</label>
          <input type="password" id="password" required minlength="6">
          <div class="error-message" id="error-password">Kata sandi minimal 6 karakter.</div>
      </div>

      <div class="form-group">
          <label for="confirm-password">Konfirmasi Kata Sandi:</label>
          <input type="password" id="confirm-password" required>
          <div class="error-message" id="error-confirm-password">Konfirmasi kata sandi tidak cocok.</div>
      </div>

      <button type="submit" class="btn-submit">Daftar Akun</button>
  </form>

  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    const form = document.getElementById('registration-form');
    const fullnameInput = document.getElementById('fullname');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    // Fungsi pembantu untuk menampilkan pesan kesalahan dan memberi bingkai merah
    function showError(inputEl, errorEl, message) {
        inputEl.classList.add('input-error');
        inputEl.classList.remove('input-success');
        errorEl.textContent = message;
        errorEl.style.display = 'block';
    }

    // Fungsi pembantu untuk membersihkan pesan kesalahan dan memberi bingkai hijau
    function clearError(inputEl, errorEl) {
        inputEl.classList.remove('input-error');
        inputEl.classList.add('input-success');
        errorEl.style.display = 'none';
    }

    // Validasi real-time saat pengguna mengetik (Event 'input')
    confirmPasswordInput.addEventListener('input', () => {
        const errorEl = document.getElementById('error-confirm-password');
        if (confirmPasswordInput.value !== passwordInput.value) {
            showError(confirmPasswordInput, errorEl, 'Konfirmasi kata sandi tidak cocok.');
        } else {
            clearError(confirmPasswordInput, errorEl);
        }
    });

    // Event listener saat submit formulir
    form.addEventListener('submit', (e) => {
        // Memotong pengiriman form bawaan (mencegah reload halaman)
        e.preventDefault();

        let isValid = true;

        // 1. Validasi Nama Lengkap menggunakan checkValidity()
        const errorFullname = document.getElementById('error-fullname');
        if (!fullnameInput.checkValidity()) {
            showError(fullnameInput, errorFullname, 'Nama lengkap wajib diisi (minimal 3 karakter).');
            isValid = false;
        } else {
            clearError(fullnameInput, errorFullname);
        }

        // 2. Validasi Email menggunakan properti validity (valueMissing & typeMismatch)
        const errorEmail = document.getElementById('error-email');
        if (emailInput.validity.valueMissing) {
            showError(emailInput, errorEmail, 'Alamat email wajib diisi.');
            isValid = false;
        } else if (emailInput.validity.typeMismatch) {
            showError(emailInput, errorEmail, 'Format penulisan email tidak sesuai.');
            isValid = false;
        } else {
            clearError(emailInput, errorEmail);
        }

        // 3. Validasi Kata Sandi
        const errorPassword = document.getElementById('error-password');
        if (!passwordInput.checkValidity()) {
            showError(passwordInput, errorPassword, 'Kata sandi minimal terdiri dari 6 karakter.');
            isValid = false;
        } else {
            clearError(passwordInput, errorPassword);
        }

        // 4. Validasi Kustom Konfirmasi Kata Sandi
        const errorConfirm = document.getElementById('error-confirm-password');
        if (confirmPasswordInput.value === '' || confirmPasswordInput.value !== passwordInput.value) {
            showError(confirmPasswordInput, errorConfirm, 'Konfirmasi kata sandi harus sama dengan kata sandi.');
            isValid = false;
        } else {
            clearError(confirmPasswordInput, errorConfirm);
        }

        // 5. Keputusan Hasil Validasi
        if (isValid) {
            alert('Pendaftaran Berhasil! Seluruh data formulir telah valid.');
            form.reset();

            // Membersihkan kelas penanda sukses pada tampilan
            [fullnameInput, emailInput, passwordInput, confirmPasswordInput].forEach(el => {
                el.classList.remove('input-success');
            });
        }
    });

  </script>
</body>
</html>
