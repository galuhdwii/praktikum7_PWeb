<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum 1.1 - Animasi DOM Berbasis Pewaktu</title>
  <style>
      .container {
          width: 100%;
          max-width: 500px;
          height: 30px;
          background-color: #e0e0e0;
          border-radius: 15px;
          overflow: hidden;
          margin-bottom: 20px;
          position: relative;
      }
      .progress-bar {
          width: 0%;
          height: 100%;
          background-color: #4caf50;
          position: absolute;
          top: 0;
          left: 0;
          transition: background-color 0.3s;
      }
      .arena {
          width: 100%;
          max-width: 500px;
          height: 150px;
          background-color: #f4f4f9;
          border: 2px dashed #bbb;
          position: relative;
          margin-bottom: 15px;
      }
      .box {
          width: 40px;
          height: 40px;
          background-color: #e74c3c;
          position: absolute;
          top: 55px;
          left: 0px;
          border-radius: 5px;
      }
      .controls button {
          padding: 8px 16px;
          margin-right: 5px;
          cursor: pointer;
      }
  </style>
</head>
<body>

  <h2>Simulasi Animasi DOM dan Progress Bar Dinamis</h2>

  <!-- Indikator Progress Bar -->
  <div class="container">
      <div id="progress" class="progress-bar"></div>
  </div>

  <!-- Arena Animasi Objek -->
  <div class="arena">
      <div id="animate-box" class="box"></div>
  </div>

  <!-- Tombol Kontrol -->
  <div class="controls">
      <button id="btn-start">Mulai Animasi</button>
      <button id="btn-pause">Jeda</button>
      <button id="btn-reset">Riset</button>
  </div>

  <script>
    // Kode JavaScript akan ditulis di sini secara bertahap
    // Langkah 2
    const progressBar = document.getElementById('progress');
    const animateBox = document.getElementById('animate-box');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');

    let timerId = null;
    let position = 0; // Posisi awal dalam piksel (0 - 460px)
    const maxPosition = 460;

    // Fungsi yang dieksekusi secara berulang oleh timer
    function step() {
        if (position >= maxPosition) {
            // Hentikan timer jika animasi sudah mencapai batas
            clearInterval(timerId);
            timerId = null;
            progressBar.style.backgroundColor = '#2196F3'; // Ubah warna ke biru saat selesai
            btnStart.disabled = true;
        } else {
            position += 4;

            // Perbarui posisi elemen box
            animateBox.style.left = position + 'px';

            // Perbarui persentase progress bar
            const percentage = Math.round((position / maxPosition) * 100);
            progressBar.style.width = percentage + '%';
        }
    }

  </script>
</body>
</html>
